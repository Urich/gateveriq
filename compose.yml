services:
  gateveriq:
    build: .
    image: ${GATEVERIQ_IMAGE:-ghcr.io/urich/gateveriq:v0.1.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  data:
